<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Firebase SDK compat (phiên bản cũ) -->
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
    
    <meta name="google-site-verification" content="XZZ8MGNN-2UBHQtNMIMNxSULV46_0SxCRN3jI7zCFvM" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hot War TBG - Bảng Xếp Hạng Game Thủ</title>
    
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f4fc 0%, #e6ecf4 100%);
            min-height: 100vh;
            padding: 30px 20px 60px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 12px 28px;
            margin-bottom: 35px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .logo-area h2 {
            font-weight: 700;
            background: linear-gradient(135deg, #1e2b3c, #1a4a6e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 1.7rem;
        }

        .nav-menu {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2c3e4e;
        }

        .nav-btn i { margin-right: 8px; }
        .nav-btn.active {
            background: #1e4663;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-login, .btn-logout, .btn-reg {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-login { background: #2c5a7a; color: white; }
        .btn-reg { background: #e9ecef; color: #1f3b4c; }
        .btn-logout { background: #b91c1c; color: white; }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 15px 0 20px 0;
            padding-left: 12px;
            border-left: 7px solid #2c5a7a;
            color: #1a2c38;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .player-card {
            background: white;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .player-card:hover { transform: translateY(-5px); }

        .player-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 24px;
            background: #d9e2ec;
            margin-bottom: 15px;
        }

        .player-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0c2e42;
        }

        .player-desc {
            color: #2c5a6e;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eef2f7;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
        }
        .btn-edit { background: #eef2fa; color: #1e5f7e; }
        .btn-delete { background: #fee9e6; color: #c7362b; }

        .comment-section {
            margin-top: 12px;
            border-top: 1px dashed #cbdde9;
            padding-top: 12px;
        }
        .comment-list { font-size: 0.75rem; color: #3a5a6e; margin-bottom: 8px; max-height: 100px; overflow-y: auto; }
        .comment-input-area { display: flex; gap: 8px; }
        .comment-input { flex:1; padding: 6px 10px; border-radius: 30px; border: 1px solid #cbdbe0; }
        .comment-submit { background: #2c5a7a; color: white; border: none; border-radius: 30px; padding: 0 12px; cursor: pointer; }

        .form-panel {
            background: white;
            border-radius: 32px;
            padding: 24px 28px;
            margin: 20px 0 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { font-weight: 600; display: block; margin-bottom: 6px; color: #1f4865; }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #ccdbe8;
        }
        .submit-btn { background: #1e6f5c; color: white; border: none; padding: 12px 28px; border-radius: 40px; font-weight: 700; cursor: pointer; }

        footer { text-align: center; margin-top: 50px; color: #5f7f97; }
        @media (max-width: 720px) {
            .top-bar { flex-direction: column; }
            .nav-menu { justify-content: center; }
        }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <!-- header -->
  <div class="top-bar">
    <div class="logo"><h1>✨ InfoHub · Quản lý nhân vật</h1></div>
    <!-- Thanh tìm kiếm mới -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên..." />
      <button id="clearSearchBtn" title="Xóa tìm kiếm">✖️</button>
    </div>
    <div class="auth-buttons" id="authArea"></div>
  </div>

  <!-- menu 4 phần -->
  <div class="category-menu" id="categoryMenu"></div>

  <!-- admin panel (chỉ hiện với admin) -->
  <div id="adminPanel" class="admin-panel hidden">
    <div class="admin-title">🛠️ [Admin] Thêm / Cập nhật thông tin mới</div>
    <div class="form-row">
      <div class="form-group">
        <label>Chuyên mục</label>
        <select id="newCategory"></select>
      </div>
      <div class="form-group">
        <label>Tên nhân vật</label>
        <input type="text" id="newName" placeholder="VD: Đình Vũ">
      </div>
      <div class="form-group">
        <label>Mô tả</label>
        <textarea id="newDesc" rows="1" placeholder="Thông tin chi tiết..."></textarea>
      </div>
      <div class="form-group">
        <label>Hình ảnh (URL hoặc tải ảnh)</label>
        <input type="file" id="imageUpload" accept="image/*">
        <input type="text" id="imageUrl" placeholder="Hoặc dán URL ảnh" style="margin-top: 6px;">
      </div>
      <div class="form-group">
        <button id="addItemBtn" class="primary" style="margin-top: 22px;">➕ Thêm thông tin</button>
      </div>
    </div>
  </div>

  <!-- khu vực hiển thị grid -->
  <div id="contentGrid" class="info-grid"></div>
  <footer>📌 Chỉ Admin mới có quyền thêm/xóa. Người dùng cần đăng nhập để bình luận.</footer>
</div>

<script>
  // ---------- DỮ LIỆU MẪU & CẤU HÌNH ----------
  const STORAGE_KEYS = {
    USERS: 'infohub_users',
    ITEMS: 'infohub_items',
    SESSION: 'infohub_session'
  };
  // categories mapping
  const CATEGORIES = [
    { id: "hot_go", label: "🔥 Hot gõ" },
    { id: "hot_treo", label: "📌 Hot treo" },
    { id: "hot_mic", label: "🎤 Hot mic" },
    { id: "hot_dame", label: "⌨👨💻 Hot dame" }
  ];

  // Hàm khởi tạo dữ liệu mẫu
  function initData() {
    // Users: tài khoản admin cố định
    let users = localStorage.getItem(STORAGE_KEYS.USERS);
    if (!users) {
      const defaultUsers = [
        { username: "Saikydz1237", password: "Nguyendinhvu", role: "admin" }
      ];
      localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(defaultUsers));
    }
    // Items mẫu cho 4 phần
    let items = localStorage.getItem(STORAGE_KEYS.ITEMS);
    if (!items) {
      const sampleItems = [
        { id: "item1", category: "hot_go", name: "Lâm Minh Đạt", description: "Game thủ chuyên nghiệp, kỹ năng gõ phím thần tốc.", imageUrl: "https://picsum.photos/id/26/400/300", comments: [] },
        { id: "item2", category: "hot_go", name: "Ngọc Trinh", description: "Streamer nổi tiếng với tốc độ gõ ấn tượng.", imageUrl: "https://picsum.photos/id/64/400/300", comments: [] },
        { id: "item3", category: "hot_treo", name: "Hoàng 'Thiết'", description: "Huyền thoại treo máy, bất bại trong các pha afk.", imageUrl: "https://picsum.photos/id/15/400/300", comments: [] },
        { id: "item4", category: "hot_mic", name: "Mỹ Tâm (Miko)", description: "Chất giọng độc lạ, không thể thiếu trong game voice.", imageUrl: "https://picsum.photos/id/20/400/300", comments: [] },
        { id: "item5", category: "hot_dame", name: "Quỳnh 'Dame'", description: "Sát thủ đường chéo, sát thương khủng.", imageUrl: "https://picsum.photos/id/29/400/300", comments: [] },
        { id: "item6", category: "hot_dame", name: "Linh Rồng", description: "Combo dame chuẩn xác, quét sạch mọi đối thủ.", imageUrl: "https://picsum.photos/id/42/400/300", comments: [] },
      ];
      localStorage.setItem(STORAGE_KEYS.ITEMS, JSON.stringify(sampleItems));
    }
  }

  // Helper lấy dữ liệu
  function getUsers() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]'); }
  function saveUsers(users) { localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users)); }
  function getItems() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.ITEMS) || '[]'); }
  function saveItems(items) { localStorage.setItem(STORAGE_KEYS.ITEMS, JSON.stringify(items)); }
  function getSession() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION) || 'null'); }
  function setSession(session) { localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(session)); }
  function clearSession() { localStorage.removeItem(STORAGE_KEYS.SESSION); }

  // State hiện tại
  let currentUser = getSession(); // { username, role }
  let currentCategory = "hot_go";
  let searchKeyword = "";          // Thêm biến tìm kiếm
  let itemsArray = getItems();

  // DOM Elements
  const authArea = document.getElementById('authArea');
  const categoryMenuDiv = document.getElementById('categoryMenu');
  const contentGrid = document.getElementById('contentGrid');
  const adminPanelDiv = document.getElementById('adminPanel');
  const newCategorySelect = document.getElementById('newCategory');
  const newNameInput = document.getElementById('newName');
  const newDescInput = document.getElementById('newDesc');
  const imageUpload = document.getElementById('imageUpload');
  const imageUrlInput = document.getElementById('imageUrl');
  const addBtn = document.getElementById('addItemBtn');
  const searchInput = document.getElementById('searchInput');
  const clearSearchBtn = document.getElementById('clearSearchBtn');

  // Helper: render auth buttons
  function renderAuth() {
    if (currentUser) {
      authArea.innerHTML = `
        <span class="user-greeting">👋 Xin chào, ${currentUser.username} (${currentUser.role === 'admin' ? 'Quản trị viên' : 'Thành viên'})</span>
        <button id="logoutBtn" class="outline">🚪 Đăng xuất</button>
      `;
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        clearSession();
        currentUser = null;
        renderAuth();
        renderAdminPanel();
        renderCurrentView(); // cập nhật giao diện (ẩn form bình luận nếu chưa login)
      });
    } else {
      authArea.innerHTML = `
        <button id="showLoginBtn" class="outline">🔐 Đăng nhập</button>
        <button id="showRegisterBtn" class="outline">📝 Đăng ký</button>
      `;
      document.getElementById('showLoginBtn')?.addEventListener('click', () => showAuthModal('login'));
      document.getElementById('showRegisterBtn')?.addEventListener('click', () => showAuthModal('register'));
    }
  }

  // Modal đăng nhập / đăng ký
  function showAuthModal(mode) {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal';
    const isLogin = mode === 'login';
    modalDiv.innerHTML = `
      <div class="modal-card">
        <h3>${isLogin ? 'Đăng nhập' : 'Tạo tài khoản'}</h3>
        <input type="text" id="modalUsername" placeholder="Tên đăng nhập" autocomplete="off">
        <input type="password" id="modalPassword" placeholder="Mật khẩu">
        <div class="modal-buttons">
          <button id="modalCancel">Hủy</button>
          <button id="modalConfirm" class="primary">${isLogin ? 'Đăng nhập' : 'Đăng ký'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    const closeModal = () => modalDiv.remove();
    modalDiv.querySelector('#modalCancel').onclick = closeModal;
    modalDiv.querySelector('#modalConfirm').onclick = () => {
      const username = modalDiv.querySelector('#modalUsername').value.trim();
      const password = modalDiv.querySelector('#modalPassword').value;
      if (!username || !password) { alert('Vui lòng nhập đầy đủ'); return; }
      const users = getUsers();
      if (isLogin) {
        const user = users.find(u => u.username === username && u.password === password);
        if (user) {
          setSession({ username: user.username, role: user.role });
          currentUser = { username: user.username, role: user.role };
          closeModal();
          renderAuth();
          renderAdminPanel();
          renderCurrentView();
        } else {
          alert('Sai tài khoản hoặc mật khẩu');
        }
      } else {
        // đăng ký
        if (users.find(u => u.username === username)) {
          alert('Tên đăng nhập đã tồn tại');
          return;
        }
        const newUser = { username, password, role: 'user' };
        users.push(newUser);
        saveUsers(users);
        alert('Đăng ký thành công! Vui lòng đăng nhập.');
        closeModal();
        showAuthModal('login');
      }
    };
  }

  // render admin panel (chỉ hiện nếu admin)
  function renderAdminPanel() {
    const isAdmin = currentUser && currentUser.role === 'admin';
    if (isAdmin) {
      adminPanelDiv.classList.remove('hidden');
      // fill category options
      newCategorySelect.innerHTML = CATEGORIES.map(cat => `<option value="${cat.id}">${cat.label}</option>`).join('');
    } else {
      adminPanelDiv.classList.add('hidden');
    }
  }

  // render menu categories
  function renderCategoryMenu() {
    categoryMenuDiv.innerHTML = CATEGORIES.map(cat => `
      <button class="cat-btn ${currentCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">${cat.label}</button>
    `).join('');
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentCategory = btn.dataset.cat;
        renderCategoryMenu();
        renderCurrentView();
      });
    });
  }

  // xóa item (chỉ admin)
  function deleteItem(itemId) {
    if (!currentUser || currentUser.role !== 'admin') { alert('Chỉ admin mới có quyền xóa!'); return; }
    if (confirm('Xóa thông tin này?')) {
      itemsArray = itemsArray.filter(i => i.id !== itemId);
      saveItems(itemsArray);
      renderCurrentView();
    }
  }

  // thêm comment
  function addComment(itemId, commentText) {
    if (!currentUser) { alert('Vui lòng đăng nhập để bình luận'); return; }
    if (!commentText.trim()) return;
    const itemIndex = itemsArray.findIndex(i => i.id === itemId);
    if (itemIndex === -1) return;
    const newComment = {
      id: Date.now() + Math.random(),
      username: currentUser.username,
      text: commentText.trim(),
      timestamp: new Date().toLocaleString()
    };
    itemsArray[itemIndex].comments = itemsArray[itemIndex].comments || [];
    itemsArray[itemIndex].comments.push(newComment);
    saveItems(itemsArray);
    renderCurrentView(); // refresh
  }

  // thêm item mới (admin)
  function addNewItem() {
    if (!currentUser || currentUser.role !== 'admin') { alert('Chỉ admin mới được thêm'); return; }
    const category = newCategorySelect.value;
    const name = newNameInput.value.trim();
    const desc = newDescInput.value.trim();
    let finalImage = imageUrlInput.value.trim();
    // xử lý upload file -> base64
    const file = imageUpload.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        createItemWithImage(category, name, desc, base64);
      };
      reader.readAsDataURL(file);
      return;
    }
    if (!finalImage) finalImage = "https://picsum.photos/id/1/400/300";
    createItemWithImage(category, name, desc, finalImage);
  }

  function createItemWithImage(category, name, desc, image) {
    if (!name) { alert('Vui lòng nhập tên'); return; }
    const newId = Date.now() + '-' + Math.random().toString(36);
    const newItem = {
      id: newId,
      category: category,
      name: name,
      description: desc || "Chưa có mô tả",
      imageUrl: image,
      comments: []
    };
    itemsArray.push(newItem);
    saveItems(itemsArray);
    // reset form
    newNameInput.value = '';
    newDescInput.value = '';
    imageUrlInput.value = '';
    imageUpload.value = '';
    renderCurrentView();
  }

  // render các card theo category hiện tại (có hỗ trợ tìm kiếm)
  function renderCurrentView() {
    // Lọc theo category trước
    let filtered = itemsArray.filter(item => item.category === currentCategory);
    // Lọc theo từ khóa tìm kiếm (nếu có)
    if (searchKeyword.trim() !== "") {
      const kw = searchKeyword.trim().toLowerCase();
      filtered = filtered.filter(item => item.name.toLowerCase().includes(kw));
    }
    if (filtered.length === 0) {
      const msg = searchKeyword.trim() !== "" 
        ? `📭 Không tìm thấy nhân vật nào có tên "${escapeHtml(searchKeyword)}" trong chuyên mục này.`
        : `📭 Chưa có thông tin nào trong chuyên mục này. ${currentUser?.role === 'admin' ? 'Hãy thêm ngay!' : 'Quay lại sau nhé.'}`;
      contentGrid.innerHTML = `<div class="empty-msg">${msg}</div>`;
      return;
    }
    contentGrid.innerHTML = filtered.map(item => {
      const isAdmin = currentUser && currentUser.role === 'admin';
      const comments = item.comments || [];
      return `
        <div class="card" data-id="${item.id}">
          <img class="card-img" src="${item.imageUrl}" alt="${item.name}" onerror="this.src='https://picsum.photos/id/13/400/300'">
          <div class="card-content">
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-desc">${escapeHtml(item.description)}</div>
            <div class="card-actions">
              ${isAdmin ? `<button class="danger delete-item-btn" data-id="${item.id}">🗑 Xóa thông tin</button>` : ''}
              <span style="font-size:0.7rem;">💬 ${comments.length} bình luận</span>
            </div>
            <!-- Phần bình luận -->
            <div class="comment-section">
              <div class="comment-list" id="commentList-${item.id}">
                ${comments.map(c => `<div class="comment-item"><span class="comment-username">${escapeHtml(c.username)}</span>: <span class="comment-text">${escapeHtml(c.text)}</span><div style="font-size: 0.6rem; opacity:0.6">${c.timestamp || ''}</div></div>`).join('')}
                ${comments.length === 0 ? '<div style="padding: 5px 0; color:#8aaec0;">Chưa có bình luận nào.</div>' : ''}
              </div>
              ${currentUser ? `
              <div class="comment-form">
                <input type="text" placeholder="Viết bình luận..." id="commentInput-${item.id}">
                <button class="primary submit-comment" data-id="${item.id}">Gửi</button>
              </div>
              ` : `<div style="font-size:0.75rem; text-align:center; padding:6px;">🔒 Đăng nhập để bình luận</div>`}
            </div>
          </div>
        </div>
      `;
    }).join('');

    // attach events xóa (admin)
    if (currentUser && currentUser.role === 'admin') {
      document.querySelectorAll('.delete-item-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = btn.dataset.id;
          deleteItem(id);
        });
      });
    }
    // attach events comment
    if (currentUser) {
      document.querySelectorAll('.submit-comment').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const itemId = btn.dataset.id;
          const inputEl = document.getElementById(`commentInput-${itemId}`);
          if (inputEl) {
            addComment(itemId, inputEl.value);
            inputEl.value = '';
          }
        });
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // refresh toàn bộ giao diện
  function refreshAll() {
    itemsArray = getItems();   // đồng bộ lại
    renderAuth();
    renderCategoryMenu();
    renderAdminPanel();
    renderCurrentView();
  }

  // Sự kiện cho thanh tìm kiếm
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      searchKeyword = e.target.value;
      renderCurrentView();
    });
  }
  if (clearSearchBtn) {
    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchKeyword = '';
      renderCurrentView();
    });
  }

  // lắng nghe thêm mới
  addBtn.addEventListener('click', addNewItem);

  // Khởi tạo dữ liệu và chạy
  initData();
  // đồng bộ currentUser từ session
